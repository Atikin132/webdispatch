<div class="user-form-container">
  <h2>{{ title() }}</h2>
  <form class="user-form" autocomplete="off" [formGroup]="userForm" (ngSubmit)="save()">
    <div class="inputs-container">
      <div class="form-group">
        <label class="form-label" for="login">{{ 'userFormLogin' | translate }}</label>
        <input
          id="login"
          class="form-input"
          pInputText
          formControlName="login"
          autocomplete="new-username"
          name="new-username"
        />
      </div>
      <div class="form-group">
        <label class="form-label" for="password">{{ 'userFormPassword' | translate }}</label>
        <p-password
          id="password"
          class="p-input"
          formControlName="password"
          [feedback]="false"
          [toggleMask]="true"
          [fluid]="true"
          autocomplete="new-password"
        />
      </div>
      <div class="form-group">
        <label class="form-label" for="name">{{ 'userFormName' | translate }}</label>
        <input class="form-input" id="name" pInputText formControlName="name" />
      </div>
      <div class="form-group">
        <label class="form-label" for="birthDate">{{ 'userFormBirthDate' | translate }}</label>
        <p-datepicker
          class="date-input"
          id="birthDate"
          formControlName="birthDate"
          [showIcon]="true"
        ></p-datepicker>
      </div>
      <div class="form-group">
        <label class="form-label" for="age">{{ 'userFormAge' | translate }}</label>
        <p-inputNumber class="p-input" id="age" formControlName="age" />
      </div>
      <div class="form-group">
        <label class="form-label" for="salary">{{ 'userFormSalary' | translate }}</label>
        <p-inputNumber
          class="p-input"
          id="salary"
          formControlName="salary"
          mode="currency"
          currency="USD"
        />
      </div>
      <div class="form-group">
        <label class="form-label" for="roles">{{ 'userFormRoles' | translate }}</label>
        <div class="roles-checkboxes form-input">
          @for (role of roles(); track role.id) {
            <div class="role-item">
              <p-checkbox [value]="role" formControlName="roles"> </p-checkbox>
              <span>{{ role.name }}</span>
            </div>
          }
        </div>
      </div>
    </div>

    <p-button
      class="save-btn"
      type="submit"
      label="{{ 'userFormSaveBtn' | translate }}"
      severity="success"
      rounded
    />
  </form>

  <p-button type="button" label="{{ 'userFormBackBtn' | translate }}" rounded (onClick)="back()" />
</div>
