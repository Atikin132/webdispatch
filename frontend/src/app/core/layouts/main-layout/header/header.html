<header class="header">
  <div class="logo"></div>

  <div class="greeting-logout">
    @if (currentUser()) {
      <p class="user-greeting">
        {{ 'headerUserGreeting' | translate }}, {{ currentUser()?.name }}!
      </p>
    }
    <app-change-lang />
    <p-button
      label="{{ 'headerLogoutBtn' | translate }}"
      rounded
      icon="pi pi-sign-out"
      (click)="onLogout()"
    />
  </div>
</header>
