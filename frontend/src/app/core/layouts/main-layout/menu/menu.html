<p-tabs [value]="activeTab()">
  <p-tablist>
    <p-tab value="/welcome" [routerLink]="['/welcome']">
      <span class="pi pi-home"></span>
      {{ 'menuHome' | translate }}
    </p-tab>

    @if (isAdmin()) {
      <p-tab value="/users" [routerLink]="['/users']">
        <span class="pi pi-users"></span>
        {{ 'menuUsers' | translate }}
      </p-tab>
    }

    <p-tab value="/loginedit" [routerLink]="['/loginedit']">
      <span class="pi pi-key"></span>
      {{ 'menuChangePassword' | translate }}
    </p-tab>
  </p-tablist>
</p-tabs>
