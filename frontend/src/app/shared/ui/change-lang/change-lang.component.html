<div class="lang-switch">
  <button
    class="en-lang-btn"
    (click)="changeLanguage('en')"
    aria-label="{{ 'switchToEnglish' | translate }}"
  ></button>

  <button
    class="ru-lang-btn"
    (click)="changeLanguage('ru')"
    aria-label="{{ 'switchToRussian' | translate }}"
  ></button>
</div>
